[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepdata-client"
version = "0.2.0rc1"
description = "Python SDK for the DeepData vector database"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Neumenon" },
]
keywords = ["vector", "database", "embeddings", "search", "deepdata"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "mypy>=1.0",
]

[tool.hatch.build]
# This SDK is nested below a repository-level `/deepdata` binary ignore rule.
# Do not let that root VCS pattern silently exclude this Python package.
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = [
    "/deepdata",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["deepdata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration_seed: populate and exercise a live canonical server",
    "integration_verify: verify the seed fixture after a server restart",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
