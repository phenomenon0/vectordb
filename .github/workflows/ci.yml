name: RC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25.12'
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  test-rc-go:
    name: Linux RC Go contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify frozen v1 and canonical v3 protobuf output
        env:
          PROTOC_ARCHIVE_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          set -euo pipefail
          proto_root="$RUNNER_TEMP/protobuf-31.1"
          proto_bin="$RUNNER_TEMP/protobuf-tools"
          archive="$RUNNER_TEMP/protoc-31.1-linux-x86_64.zip"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$proto_root" "$proto_bin"
          unzip -q "$archive" -d "$proto_root"
          GOBIN="$proto_bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          GOBIN="$proto_bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          PATH="$proto_root/bin:$proto_bin:$PATH" \
            PROTOC_INCLUDE="$proto_root/include" \
            scripts/check_proto_generated.sh
      - name: Verify release artifact version parity
        run: python3 scripts/check_version_contract.py
      - name: Vet the supported server surface
        run: |
          go vet \
            ./api/gen/deepdata/v1 \
            ./api/gen/deepdata/v3 \
            ./cmd/deepdata \
            ./internal/collection \
            ./internal/security \
            ./internal/storage \
            ./internal/wal
        env:
          CGO_ENABLED: '0'
      - name: Test the supported server surface
        run: |
          go test -short -timeout 600s -count=1 \
            ./api/gen/deepdata/v1 \
            ./api/gen/deepdata/v3 \
            ./cmd/deepdata \
            ./internal/collection \
            ./internal/cowrieutil \
            ./internal/encoding \
            ./internal/filter \
            ./internal/hybrid \
            ./internal/index/simd \
            ./internal/logging \
            ./internal/security \
            ./internal/sparse \
            ./internal/storage \
            ./internal/telemetry \
            ./internal/wal
        env:
          CGO_ENABLED: '0'
      - name: Test the vendored HNSW graph module
        working-directory: internal/index/hnsw
        run: go test -short -timeout 300s -count=1 ./...
        env:
          CGO_ENABLED: '0'

  test-rc-race:
    name: Linux RC race contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run race-sensitive supported packages
        run: |
          go test -race -short -timeout 900s -count=1 \
            ./cmd/deepdata \
            ./internal/collection \
            ./internal/security \
            ./internal/storage \
            ./internal/wal
        env:
          CGO_ENABLED: '1'
      - name: Run SIMD C reference correctness when AVX2 is available
        run: |
          if grep -qw avx2 /proc/cpuinfo; then
            go test -tags=cref -timeout 60s -count=1 ./internal/index/simd -run '^TestCRef_Correctness$'
          else
            echo 'AVX2 unavailable; C reference execution skipped'
          fi
        env:
          CGO_ENABLED: '1'

  test-python-sdk:
    name: Canonical Python client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install SDK test and build dependencies
        working-directory: sdk/python
        run: python -m pip install --disable-pip-version-check '.[dev]' build
      - name: Run SDK contract tests
        working-directory: sdk/python
        run: python -m pytest -q --ignore=tests/test_integration.py
      - name: Run authenticated live SDK and restart contract
        working-directory: sdk/python
        env:
          DEEPDATA_API_TOKEN: canonical-python-live-test-token-0001
          DEEPDATA_INTEGRATION_ID: ci
          DEEPDATA_INTEGRATION_REQUIRED: '1'
          DEEPDATA_URL: http://127.0.0.1:18080
        run: |
          set -euo pipefail
          server="$RUNNER_TEMP/deepdata-sdk-live"
          state_root="$RUNNER_TEMP/deepdata-sdk-state"
          server_log="$RUNNER_TEMP/deepdata-sdk-live.log"
          server_pid=""
          go build -trimpath -o "$server" ../../cmd/deepdata
          mkdir -m 0700 "$state_root"

          stop_server() {
            if [[ -z "$server_pid" ]] || ! kill -0 "$server_pid" 2>/dev/null; then
              return
            fi
            kill -TERM "$server_pid"
            for _ in $(seq 1 300); do
              kill -0 "$server_pid" 2>/dev/null || break
              sleep 0.1
            done
            if kill -0 "$server_pid" 2>/dev/null; then
              echo "live SDK server did not stop after SIGTERM" >&2
              return 1
            fi
            wait "$server_pid"
            server_pid=""
          }
          cleanup() {
            rc=$?
            stop_server || rc=$?
            if ((rc != 0)); then
              tail -n 160 "$server_log" >&2 || true
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          start_server() {
            VECTORDB_MODE=local \
            VECTORDB_BASE_DIR="$state_root" \
            VECTORDB_DATA_DIR=local \
            PORT=18080 \
            GRPC_PORT=0 \
            API_TOKEN="$DEEPDATA_API_TOKEN" \
            REQUIRE_AUTH=1 \
            "$server" serve >>"$server_log" 2>&1 &
            server_pid=$!
            for _ in $(seq 1 300); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "live SDK server exited before readiness" >&2
                return 1
              fi
              if curl --fail --silent --max-time 1 "$DEEPDATA_URL/readyz" >/dev/null; then
                return
              fi
              sleep 0.1
            done
            echo "live SDK server did not become ready" >&2
            return 1
          }

          start_server
          python -m pytest -q tests/test_integration.py -m integration_seed
          stop_server
          start_server
          python -m pytest -q tests/test_integration.py -m integration_verify
          stop_server
      - name: Run strict SDK typing
        working-directory: sdk/python
        run: python -m mypy deepdata
      - name: Build source and wheel distributions
        working-directory: sdk/python
        run: python -m build
      - name: Smoke the built wheel outside the source tree
        working-directory: sdk/python
        run: |
          python -m venv --system-site-packages /tmp/deepdata-sdk-wheel
          /tmp/deepdata-sdk-wheel/bin/pip install --no-deps dist/deepdata_client-*.whl
          cd /tmp
          /tmp/deepdata-sdk-wheel/bin/python -c "import deepdata; from deepdata import TenantSearchRequest; assert TenantSearchRequest.model_validate({'queries': {'dense': [1.0]}}).top_k == 10"

  test-deployment-manifests:
    name: Linux container, Compose, and Helm contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.4
      - name: Lint and verify Docker/Compose/Helm contracts
        run: bash tests/deployment_manifests_test.sh
      - name: Build production container
        run: docker build --tag deepdata-contract:test .
      - name: Verify direct container lifecycle
        run: bash tests/container_contract_test.sh deepdata-contract:test
      - name: Verify Docker Compose persistence lifecycle
        env:
          DEEPDATA_IMAGE: deepdata-contract:test
        run: bash tests/compose_contract_test.sh

  cross-compile-proof:
    name: Compile proof only (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compile without publishing a non-Linux runtime artifact
        run: go build -trimpath -ldflags="-s -w" -o /tmp/deepdata-compile-proof-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/deepdata/
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  test-experimental-source:
    name: Experimental source (non-RC)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compile and test explicitly unsupported packages
        run: |
          go test -short -timeout 300s -count=1 \
            ./internal/index/... \
            ./internal/cluster \
            ./internal/extraction \
            ./internal/feedback \
            ./internal/graph \
            ./internal/obsidian
        env:
          CGO_ENABLED: '0'
