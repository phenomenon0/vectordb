{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "the DeepData RC supports exactly one replica" }}
{{- end }}
{{- if ne .Values.config.mode "local" }}
{{- fail "the DeepData RC supports only config.mode=local" }}
{{- end }}
{{- if not .Values.persistence.enabled }}
{{- fail "the DeepData RC chart requires persistent storage" }}
{{- end }}
{{- if not .Values.persistence.verifiedPOSIXSemantics }}
{{- fail "set persistence.verifiedPOSIXSemantics=true only after verifying flock/fsync/atomic-rename semantics" }}
{{- end }}
{{- if ne (index .Values.nodeSelector "kubernetes.io/os") "linux" }}
{{- fail "the DeepData RC requires nodeSelector kubernetes.io/os=linux" }}
{{- end }}
{{- if ne (index .Values.nodeSelector "kubernetes.io/arch") "amd64" }}
{{- fail "the DeepData RC currently requires nodeSelector kubernetes.io/arch=amd64" }}
{{- end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
{{- fail "image.digest must be an immutable lowercase sha256 digest" }}
{{- end }}
{{- if eq (trim .Values.auth.existingSecret) "" }}
{{- fail "auth.existingSecret is required" }}
{{- end }}
{{- if eq (trim .Values.auth.existingSecretKey) "" }}
{{- fail "auth.existingSecretKey is required" }}
{{- end }}
{{- if and (ne .Values.auth.existingSecretType "apiToken") (ne .Values.auth.existingSecretType "jwtSecret") }}
{{- fail "auth.existingSecretType must be apiToken or jwtSecret" }}
{{- end }}
{{- $authSecretName := .Values.auth.existingSecret }}
{{- $claimName := printf "%s-deepdata-data" .Release.Name }}
{{- if .Values.persistence.existingClaim }}
{{- $claimName = .Values.persistence.existingClaim }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deepdata
  labels:
    app.kubernetes.io/name: deepdata
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deepdata
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepdata
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        deepdata.io/auth-secret-revision: {{ .Values.auth.secretRevision | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: deepdata
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.config.grpcPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.config.port | quote }}
            - name: GRPC_PORT
              value: {{ .Values.config.grpcPort | quote }}
            - name: VECTORDB_BASE_DIR
              value: /data
            - name: VECTORDB_DATA_DIR
              value: local
            - name: VECTORDB_MODE
              value: {{ .Values.config.mode | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: TENANT_RPS
              value: {{ .Values.config.tenantRps | quote }}
            - name: TENANT_BURST
              value: {{ .Values.config.tenantBurst | quote }}
            - name: AUTH_FAILURE_RPS
              value: {{ .Values.config.authFailureRps | quote }}
            - name: AUTH_FAILURE_BURST
              value: {{ .Values.config.authFailureBurst | quote }}
            - name: MAX_RATE_LIMIT_KEYS
              value: {{ .Values.config.maxRateLimitKeys | quote }}
            {{- if eq .Values.auth.existingSecretType "apiToken" }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecretName }}
                  key: {{ .Values.auth.existingSecretKey }}
            {{- end }}
            {{- if eq .Values.auth.existingSecretType "jwtSecret" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecretName }}
                  key: {{ .Values.auth.existingSecretKey }}
            {{- end }}
            - name: REQUIRE_AUTH
              value: "1"
            {{- if .Values.telemetry.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.serviceName | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $claimName }}
        - name: tmp
          emptyDir: {}
