# Default values for DeepData vector database

replicaCount: 1

image:
  repository: deepdata
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  grpcPort: 50051

# Environment-based configuration
config:
  port: 8080
  grpcPort: 50051
  mode: local
  logFormat: json
  apiRps: "100"
  # HNSW tuning
  # hnswM: "16"
  # hnswEfSearch: "200"

# Authentication (leave empty to disable)
auth:
  apiToken: ""
  jwtSecret: ""
  requireAuth: false

# OpenTelemetry tracing
telemetry:
  enabled: false
  endpoint: ""
  serviceName: deepdata

# The numeric identity matches the official image. fsGroup lets kubelet make a
# fresh supported PVC writable without starting DeepData as root. Custom images
# must either retain UID/GID 10001 or override all three IDs together.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Persistence for WAL + index files
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Liveness and readiness probes
probes:
  liveness:
    path: /livez
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
