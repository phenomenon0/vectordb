# Default values for DeepData vector database

replicaCount: 1

image:
  repository: deepdata
  tag: 0.2.0-rc.1
  # Required for an RC deployment. Use the published manifest digest, including
  # the sha256: prefix; mutable tag-only deployment is intentionally rejected.
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  grpcPort: 50051

# Environment-based configuration
config:
  port: 8080
  grpcPort: 50051
  mode: local
  logFormat: json
  tenantRps: "100"
  tenantBurst: "100"
  authFailureRps: "1"
  authFailureBurst: "5"
  maxRateLimitKeys: "100000"
  # HNSW tuning
  # hnswM: "16"
  # hnswEfSearch: "200"

# Authentication is mandatory and comes only from an existing Kubernetes
# Secret. Supplying secret material through Helm values would retain it in the
# Helm release record, so the RC chart deliberately does not support that path.
auth:
  existingSecret: deepdata-auth
  existingSecretType: apiToken
  existingSecretKey: api-token
  # Increment this value when rotating data in the same Secret to trigger a
  # Deployment rollout. Changing the Secret name or key already triggers one.
  secretRevision: "1"

# OpenTelemetry tracing
telemetry:
  enabled: false
  endpoint: ""
  serviceName: deepdata

# Network isolation for the DeepData pod. When enabled, a default-deny
# NetworkPolicy confines the pod to deny-all egress and allows ingress only on
# the advertised HTTP and gRPC ports. It requires a CNI with NetworkPolicy
# support (Calico, Cilium, OVN-Kubernetes, etc.); kindnet and other
# non-enforcing CNIs accept the manifest but apply no policy — under those
# clusters the operator must implement this isolation externally.
networkPolicy:
  # Set to false when the operator delegates isolation to a cluster-level
  # mechanism; the chart then renders no NetworkPolicy.
  enabled: true
  # CIDR blocks the pod may reach. Keep empty for the RC default (no outbound
  # connections). Required when telemetry.enabled=true because the OTLP
  # exporter must be reachable.
  egressTo: []

# The numeric identity matches the official image. fsGroup lets kubelet make a
# fresh supported PVC writable without starting DeepData as root. Custom images
# must either retain UID/GID 10001 or override all three IDs together.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Persistence for WAL + index files
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  # Set true only after verifying the selected volume provides advisory locks,
  # atomic same-directory rename, fsync, and directory fsync semantics.
  verifiedPOSIXSemantics: false

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}

# Liveness and readiness probes
probes:
  startup:
    path: /livez
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    path: /livez
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

  readiness:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 90
